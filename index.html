<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HỆ THỐNG PHÂN PHỐI KEY TOOL</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: rgba(255, 255, 255, 0.05);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h2 { margin-bottom: 20px; font-size: 22px; color: #00ffcc; }
        .key-box {
            background: rgba(0, 0, 0, 0.4);
            padding: 15px;
            border-radius: 8px;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 20px;
            word-break: break-all;
            border: 1px dashed #00ffcc;
            color: #ffff00;
        }
        button {
            background: linear-gradient(to right, #00ffcc, #00a8cc);
            border: none;
            color: #0f2027;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🔑 NHẬN KEY TOOL NGẪU NHIÊN 🔑</h2>
    <p>Vui lòng sao chép mã bên dưới và gửi vào Bot Telegram để kích hoạt</p>
    
    <div class="key-box" id="keyText">ĐANG TẢI KEY...</div>
    
    <button id="btnCopy" onclick="copyKey()" disabled>📋 SAO CHÉP KEY</button>
</div>

<script>
// Đường dẫn đến file key.txt của bạn trên GitHub Pages
const TXT_URL = "key.txt"; 

async function loadRandomKey() {
    try {
        // Kiểm tra xem trình duyệt đã lưu key phiên này chưa để tránh đổi key khi F5
        let sessionKey = sessionStorage.getItem("user_key");
        
        if (sessionKey) {
            document.getElementById("keyText").innerText = sessionKey;
            document.getElementById("btnCopy").disabled = false;
            return;
        }

        // Tải nội dung file txt từ github
        let response = await fetch(TXT_URL);
        let textData = await response.text();
        
        // Tách chuỗi dữ liệu thành mảng theo từng dòng
        let keysArray = textData.split("\n").map(k => k.trim()).filter(k => k.length > 0);
        
        if (keysArray.length > 0) {
            // Chọn ngẫu nhiên 1 key trong danh sách 200 key
            let randomIndex = Math.floor(Math.random() * keysArray.length);
            let selectedKey = keysArray[randomIndex];
            
            // Lưu vào bộ nhớ tạm của trình duyệt
            sessionStorage.setItem("user_key", selectedKey);
            
            document.getElementById("keyText").innerText = selectedKey;
            document.getElementById("btnCopy").disabled = false;
        } else {
            document.getElementById("keyText").innerText = "HẾT KEY TRÊN HỆ THỐNG";
        }
    } catch (error) {
        document.getElementById("keyText").innerText = "LỖI KẾT NỐI SERVER";
    }
}

loadRandomKey();

function copyKey() {
    var keyText = document.getElementById("keyText").innerText;
    navigator.clipboard.writeText(keyText).then(function() {
        alert("✅ Đã sao chép Key thành công!");
    });
}
</script>

</body>
</html>
