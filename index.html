            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #162447;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #e43f5a;
            margin-bottom: 20px;
            font-size: 24px;
        }
        .key-box {
            background-color: #1f4068;
            padding: 15px;
            border-radius: 8px;
            font-size: 20px;
            font-weight: bold;
            letter-spacing: 2px;
            margin: 20px 0;
            border: 2px dashed #00fff0;
            color: #00fff0;
            word-break: break-all;
        }
        .btn-copy {
            background-color: #e43f5a;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
        }
        .btn-copy:hover {
            background-color: #ff4d6d;
        }
        .note {
            font-size: 13px;
            color: #b0b0b0;
            margin-top: 15px;
            line-height: 1.5;
        }
    </style>
</head>

        "TOOL-Z5X2C8V4", "TOOL-B7N1M9K3"
    ];

    // Hàm lấy ngẫu nhiên 1 key trong danh sách trên
    function getValidKey() {
        const randomIndex = Math.floor(Math.random() * BOT_KEYS.length);
        return BOT_KEYS[randomIndex];
    }

    window.onload = function() {
        let systemKey = localStorage.getItem('user_tool_key');
        let setupTime = localStorage.getItem('user_tool_key_time');
        
        const hoursLimit = 24; // Hạn dùng 24 tiếng đồng bộ với Bot Telegram
        const now = new Date().getTime();

        // Kiểm tra nếu quá 24 tiếng thì xóa key cũ
        if (setupTime && (now - setupTime > hoursLimit * 60 * 60 * 1000)) {
            localStorage.removeItem('user_tool_key');
            localStorage.removeItem('user_tool_key_time');
            systemKey = null;
        }

        // Nếu chưa có key (hoặc vừa hết hạn), bốc 1 key trong danh sách 200 mã và khóa lại
        if (!systemKey) {
            systemKey = getValidKey();
            localStorage.setItem('user_tool_key', systemKey);
            localStorage.setItem('user_tool_key_time', now);
            console.log("Đã cấp mã Key mới hợp lệ.");
        } else {
            console.log("Key cũ vẫn trong hạn 24 giờ. Tiếp tục hiển thị.");
        }

        // Hiển thị Key ra màn hình cho user
        document.getElementById('keyDisplay').innerText = systemKey;
    };

    // Hàm copy mã nhanh
    function copyKey() {
        const keyText = document.getElementById('keyDisplay').innerText;
        navigator.clipboard.writeText(keyText).then(() => {
            alert('👉 Đã sao chép Key thành công!');
        }).catch(err => {
            alert('Lỗi sao chép, vui lòng bôi đen mã để tự copy.');
        });
    }
