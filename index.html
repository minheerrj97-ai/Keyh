<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Lấy Key Tool</title>
    <link href="jsdelivr.net" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .key-card { max-width: 500px; width: 100%; border: none; border-radius: 15px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1); }
        .key-display { background-color: #e9ecef; border: 2px dashed #0d6efd; font-family: 'Courier New', Courier, monospace; font-weight: bold; font-size: 1.2rem; letter-spacing: 1px; }
    </style>
</head>
<body>

<div class="container d-flex justify-content-center">
    <div class="card key-card p-4 text-center bg-white">
        <h3 class="text-primary mb-3">🎉 Vượt Link Thành Công!</h3>
        <p class="text-muted">Chúc mừng bạn đã hoàn thành nhiệm vụ. Dưới đây là Key kích hoạt Tool của bạn:</p>
        
        <div id="keyBox" class="key-display p-3 rounded mb-4 text-break">Đang tạo Key...</div>

        <div class="d-grid gap-2">
            <button id="btnCopy" class="btn btn-outline-secondary btn-lg" onclick="copyKey()">📋 Sao Chép Key</button>
            <a id="btnTelegram" href="#" class="btn btn-primary btn-lg disabled" target="_blank">🚀 Mở Telegram Kích Hoạt Tool</a>
        </div>
        <p class="text-danger mt-3 small">* Vui lòng không chia sẻ Key này cho người khác.</p>
    </div>
</div>

<script>
    // 1. ĐIỀN USERNAME BOT TELEGRAM CỦA BẠN VÀO ĐÂY (Không chứa dấu @)
    const TELEGRAM_BOT_USERNAME = "Bot837474_bot";

    // 2. DÁN 1000 KEY CỦA BẠN VÀO TRONG MẢNG NÀY
    const DANH_SACH_1000_KEY = [
        "HaiCoding_Key22_EZ2S",
        "Key_Tool_9999_AX12",
        "Key_Tool_8888_BY34",
        "Key_Tool_7777_CZ56"
        // ... Dán tiếp các key còn lại vào đây, cách nhau bằng dấu phẩy
    ];

    window.onload = function() {
        const keyBox = document.getElementById('keyBox');
        const btnTelegram = document.getElementById('btnTelegram');

        // Hệ thống tự động bốc ngẫu nhiên 1 Key từ danh sách 1000 key ở trên
        if (DANH_SACH_1000_KEY.length > 0) {
            const randomIndex = Math.floor(Math.random() * DANH_SACH_1000_KEY.length);
            const selectedKey = DANH_SACH_1000_KEY[randomIndex];

            // Hiển thị Key ra màn hình
            keyBox.innerText = selectedKey;

            // Gắn Key vào link chuyển hướng t.me/bot?start=KEY
            btnTelegram.href = `t.me{TELEGRAM_BOT_USERNAME}?start=${encodeURIComponent(selectedKey)}`;
            btnTelegram.classList.remove('disabled');
        } else {
            keyBox.innerText = "❌ Hệ thống chưa cấu hình danh sách Key!";
            keyBox.style.color = "red";
            keyBox.style.borderColor = "red";
        }
    }

    function copyKey() {
        const keyText = document.getElementById('keyBox').innerText;
        if(keyText && !keyText.includes("❌") && keyText !== "Đang tạo Key...") {
            navigator.clipboard.writeText(keyText).then(() => {
                const btnCopy = document.getElementById('btnCopy');
                btnCopy.innerText = "✅ Đã Sao Chép!";
                btnCopy.className = "btn btn-success btn-lg";
                setTimeout(() => {
                    btnCopy.innerText = "📋 Sao Chép Key";
                    btnCopy.className = "btn btn-outline-secondary btn-lg";
                }, 2000);
            });
        }
    }
</script>
</body>
</html>
