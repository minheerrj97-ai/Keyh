<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Lấy Key Tool</title>
    <!-- Nhúng Bootstrap 5 CSS để giao diện đẹp và responsive -->
    <link href="jsdelivr.net" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .key-card {
            max-width: 500px;
            width: 100%;
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }
        .key-display {
            background-color: #e9ecef;
            border: 2px dashed #0d6efd;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bold;
            font-size: 1.2rem;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

<div class="container d-flex justify-content-center">
    <div class="card key-card p-4 text-center bg-white">
        <h3 class="text-primary mb-3">🎉 Vượt Link Thành Công!</h3>
        <p class="text-muted">Chúc mừng bạn đã hoàn thành nhiệm vụ. Dưới đây là Key kích hoạt Tool của bạn:</p>
        
        <!-- Ô hiển thị Key -->
        <div id="keyBox" class="key-display p-3 rounded mb-4 text-break">
            Đang tải Key...
        </div>

        <!-- Nút bấm tương tác -->
        <div class="d-grid gap-2">
            <button id="btnCopy" class="btn btn-outline-secondary btn-lg" onclick="copyKey()">
                📋 Sao Chép Key
            </button>
            <a id="btnTelegram" href="#" class="btn btn-primary btn-lg disabled" target="_blank">
                🚀 Mở Telegram Kích Hoạt Tool
            </a>
        </div>
        
        <p class="text-danger mt-3 small">* Vui lòng không chia sẻ Key này cho người khác.</p>
    </div>
</div>

<script>
    // Điền User Name của Telegram Bot bạn vào đây (Không chứa chữ @)
    const TELEGRAM_BOT_USERNAME = "Bot837474_bot";

    // Hàm tự động trích xuất Key từ URL khi trang web được tải
    function getQueryParam(param) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(param);
    }

    // Xử lý hiển thị và gán link chuyển hướng
    window.onload = function() {
        const key = getQueryParam('key');
        const keyBox = document.getElementById('keyBox');
        const btnTelegram = document.getElementById('btnTelegram');

        if (key) {
            // Hiển thị Key lên màn hình
            keyBox.innerText = key;
            
            // Cấu hình link Deep Linking chuyển hướng trực tiếp vào Bot Telegram kèm theo tham số Key
            // Định dạng kết quả: t.me
            btnTelegram.href = `t.me{TELEGRAM_BOT_USERNAME}?start=${encodeURIComponent(key)}`;
            btnTelegram.classList.remove('disabled');
        } else {
            keyBox.innerText = "❌ Không tìm thấy Key trên URL!";
            keyBox.style.color = "red";
            keyBox.style.borderColor = "red";
        }
    }

    // Hàm hỗ trợ người dùng copy Key nhanh bằng 1 cú click
    function copyKey() {
        const keyText = document.getElementById('keyBox').innerText;
        if(keyText && !keyText.includes("❌") && keyText !== "Đang tải Key...") {
            navigator.clipboard.writeText(keyText).then(() => {
                const btnCopy = document.getElementById('btnCopy');
                btnCopy.innerText = "✅ Đã Sao Chép!";
                btnCopy.className = "btn btn-success btn-lg";
                setTimeout(() => {
                    btnCopy.innerText = "📋 Sao Chép Key";
                    btnCopy.className = "btn btn-outline-secondary btn-lg";
                }, 2000);
            }).catch(err => {
                alert("Lỗi sao chép, vui lòng tự bôi đen để copy!");
            });
        }
    }
</script>

</body>
</html>
